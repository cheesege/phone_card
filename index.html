<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>cheese_ge — 社群連結</title>
  <meta name="description" content="cheese_ge 的社群連結入口：Instagram、Discord、個人網站、LINE。" />
  <meta name="theme-color" content="#0d0800" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="cheese_ge — 社群連結" />
  <meta property="og:description" content="追蹤我的社群：Instagram、Discord、個人網站、LINE。" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --amber: #ffb627;
      --amber-soft: #ffd27a;
      --amber-deep: #e08e00;
      --bg: #0d0800;
      --surface: #ffb6270b;
      --surface-hover: #ffb62717;
      --line: #ffb62738;
      --line-strong: #ffb62773;
      --text: #f7f3ea;
      --text-muted: #cdbfa4;
      --text-faint: #8e8069;
      --glow: 0 0 40px -12px #ffb6278c;
      --radius: 18px;
      --maxw: 720px;
      --font: "Noto Sans TC", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color-scheme: dark;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #fdfaf3;
        --surface: #ffb62717;
        --surface-hover: #ffb62729;
        --line: #b4780038;
        --line-strong: #b4780066;
        --amber: #b87400;
        --amber-soft: #8a5600;
        --amber-deep: #ffb627;
        --text: #241a08;
        --text-muted: #5e4f36;
        --text-faint: #8b7a5d;
        --glow: 0 12px 32px -18px #78500080;
        color-scheme: light;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100svh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-weight: 500;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(1.5rem, 6vw, 3rem) clamp(1.15rem, 5vw, 2rem);
    }

    /* 背景：暖色光暈 + 網格 */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background:
        radial-gradient(60rem 40rem at 12% -10%, #ffb62729, #0000 60%),
        radial-gradient(48rem 34rem at 92% 8%, #ff8c271a, #0000 62%),
        radial-gradient(50rem 40rem at 50% 112%, #ffb6271a, #0000 65%);
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: .35;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 64px 64px;
      -webkit-mask-image: radial-gradient(75% 65% at 50% 0, #000 0%, #0000 100%);
      mask-image: radial-gradient(75% 65% at 50% 0, #000 0%, #0000 100%);
    }

    .page {
      width: min(100%, var(--maxw));
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 標題區 */
    .hero { text-align: center; margin-bottom: clamp(1.75rem, 6vw, 2.75rem); }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: .95rem;
      color: var(--amber);
      letter-spacing: -.01em;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 0 0 color-mix(in srgb, var(--amber) 60%, transparent);
      animation: pulse 2.6s ease-out infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--amber) 55%, transparent); }
      70%  { box-shadow: 0 0 0 10px #0000; }
      100% { box-shadow: 0 0 0 0 #0000; }
    }

    .hero h1 {
      margin: .7rem 0 0;
      font-size: clamp(2.1rem, 8vw, 3.25rem);
      font-weight: 900;
      letter-spacing: -.04em;
      line-height: 1.1;
      background: linear-gradient(100deg, var(--amber-deep), var(--amber) 42%, var(--amber-soft));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .hero p {
      margin: .6rem 0 0;
      color: var(--text-muted);
      font-size: clamp(.9rem, 3.4vw, 1.02rem);
    }

    /* 區塊標題 */
    .section-head {
      width: 100%;
      text-align: center;
      margin: clamp(2.5rem, 9vw, 3.5rem) 0 clamp(1.15rem, 4vw, 1.6rem);
    }
    .rule {
      display: block;
      width: min(100%, 240px);
      height: 1px;
      margin: 0 auto clamp(1.15rem, 4vw, 1.6rem);
      background: linear-gradient(90deg, #0000, var(--line-strong), #0000);
    }
    .section-head h2 {
      margin: 0;
      font-size: clamp(1.45rem, 6vw, 2rem);
      font-weight: 900;
      letter-spacing: -.035em;
      line-height: 1.2;
      background: linear-gradient(100deg, var(--amber-deep), var(--amber) 42%, var(--amber-soft));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .section-head .kicker {
      margin: .35rem 0 0;
      color: var(--text-faint);
      font-size: clamp(.8rem, 3.2vw, .9rem);
    }

    /* 方格 */
    .grid {
      --gap: clamp(.85rem, 3.5vw, 1.25rem);
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--gap);
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .7rem;
      aspect-ratio: 1 / 1;
      padding: 1rem;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      text-decoration: none;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
      transition: transform .22s cubic-bezier(.16,1,.3,1),
                  background .22s, border-color .22s, box-shadow .22s;
    }
    .card .icon {
      width: clamp(38px, 12vw, 52px);
      height: clamp(38px, 12vw, 52px);
      color: var(--amber);
      transition: transform .22s cubic-bezier(.16,1,.3,1);
    }
    .card .icon svg { width: 100%; height: 100%; display: block; }
    .card .label {
      font-weight: 700;
      font-size: clamp(1rem, 4vw, 1.15rem);
      letter-spacing: .01em;
    }
    .card .sub {
      font-family: var(--font-mono);
      font-size: clamp(.72rem, 3vw, .82rem);
      color: var(--text-faint);
      word-break: break-all;
    }

    @media (hover: hover) {
      .card:hover {
        transform: translateY(-4px);
        background: var(--surface-hover);
        border-color: var(--line-strong);
        box-shadow: var(--glow);
      }
      .card:hover .icon { transform: scale(1.08); }
    }
    .card:active { transform: translateY(-1px) scale(.99); }
    .card:focus-visible {
      outline: 2px solid var(--amber);
      outline-offset: 3px;
    }

    /* Discord 方格是 <button>，重置預設樣式 */
    button.card {
      width: 100%;
      font: inherit;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
    }
    .card.copied {
      background: var(--surface-hover);
      border-color: var(--line-strong);
    }
    .card.copied .icon { color: var(--amber-soft); }

    /* 桌機：四格一排 */
    @media (min-width: 760px) {
      .grid { grid-template-columns: repeat(4, 1fr); }
      .card { gap: .85rem; }
      /* 兩格區塊：置中並縮到與四格區塊同樣的方格尺寸 */
      .grid.duo {
        grid-template-columns: repeat(2, 1fr);
        width: calc(50% - var(--gap) / 2);
        margin-inline: auto;
      }
    }

    footer {
      margin-top: clamp(1.75rem, 6vw, 2.75rem);
      color: var(--text-faint);
      font-size: .8rem;
      text-align: center;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    // Discord 方格：點擊複製使用者名稱
    (function () {
      var btn = document.querySelector("[data-copy]");
      if (!btn) return;
      var hint = btn.querySelector("[data-copy-hint]");
      var original = hint.textContent;
      var timer;

      function copy(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text);
        }
        return new Promise(function (resolve, reject) {
          try {
            var ta = document.createElement("textarea");
            ta.value = text;
            ta.setAttribute("readonly", "");
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            var ok = document.execCommand("copy");
            document.body.removeChild(ta);
            ok ? resolve() : reject();
          } catch (e) { reject(e); }
        });
      }

      btn.addEventListener("click", function () {
        copy(btn.dataset.username).then(function () {
          hint.textContent = "已複製 ✓";
          btn.classList.add("copied");
        }).catch(function () {
          hint.textContent = "複製失敗，請長按選取";
        }).finally(function () {
          clearTimeout(timer);
          timer = setTimeout(function () {
            hint.textContent = original;
            btn.classList.remove("copied");
          }, 1800);
        });
      });
    })();
  </script>
